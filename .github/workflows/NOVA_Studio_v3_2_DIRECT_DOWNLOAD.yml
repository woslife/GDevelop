# NOVA Studio v3.2 — native GDevelop fork with Construct-inspired mobile UI.
# Complete single-file installer; original GDevelop license and engine remain intact.
name: NOVA Studio v3.2 — Construct Dark

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/nova-studio-v3-2.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nova-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout original fork
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js and cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: newIDE/app/package-lock.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
