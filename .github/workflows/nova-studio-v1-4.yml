      - name: Install original GDevelop dependencies
        working-directory: newIDE/app
        env:
          NODE_OPTIONS: '--max-old-space-size=5120'
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund || \
          npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build real editor and GDJS runtime
        working-directory: newIDE/app
        env:
          NODE_OPTIONS: '--max-old-space-size=5120'
          CI: 'false'
          PUBLIC_URL: /${{ github.event.repository.name }}
        run: npm run build:dev
      - name: Verify real editor outputs
        shell: bash
        run: |
          test -s newIDE/app/build/index.html
          test -s newIDE/app/build/nova-shell.js
          test -s newIDE/app/build/nova-shell.css
          test -s newIDE/app/build/manifest.json
          test -d newIDE/app/build/GDJS/Runtime
          cp newIDE/app/build/index.html newIDE/app/build/404.html
          touch newIDE/app/build/.nojekyll
          du -sh newIDE/app/build
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: newIDE/app/build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy NOVA Studio
        id: pages
        uses: actions/deploy-pages@v4
