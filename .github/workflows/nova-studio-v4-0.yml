      - name: Verify NOVA patch integrity before compiling
        shell: bash
        run: |
          node --check newIDE/app/public/nova-shell.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('newIDE/app')
          page=(root/'public/index.html').read_text()
          assert page.count('NOVA_STUDIO_V40')==1
          assert (root/'src/MainFrame/EditorContainers/HomePage/CreateSection/NovaProjectHome.js').is_file()
          assert 'nova-native-add-object-button' not in (root/'src/ObjectsList/index.js').read_text()
          assert 'nova-events-search-button' in (root/'src/EventsSheet/Toolbar.js').read_text()
          assert 'nova-unsaved-warning' in (root/'src/ProjectCreation/NewProjectSetupDialog.js').read_text()
          assert 'nova-scene-grid-toggle-button' in (root/'src/SceneEditor/SwipeableDrawerEditorsDisplay/Toolbar.js').read_text()
          assert 'NOVA 4.0' in (root/'public/nova-construct-theme.css').read_text()
          manifest=json.loads((root/'public/manifest.json').read_text())
          assert manifest['short_name']=='NOVA Studio'
          print('NOVA v4.0 patch and PWA metadata: OK')
          PY
      - name: Install original GDevelop dependencies
        working-directory: newIDE/app
        env:
          NODE_OPTIONS: '--max-old-space-size=5120'
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund || \
          npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build real editor and GDJS runtime
        working-directory: newIDE/app
        env:
          NODE_OPTIONS: '--max-old-space-size=5120'
          CI: 'false'
          PUBLIC_URL: /${{ github.event.repository.name }}
        run: npm run build:dev
      - name: Verify real editor outputs
        shell: bash
        run: |
          test -s newIDE/app/build/index.html
          test -s newIDE/app/build/nova-shell.js
          test -s newIDE/app/build/nova-construct-theme.css
          test -s newIDE/app/build/nova-shell.css
          test -s newIDE/app/build/manifest.json
          test -d newIDE/app/build/GDJS/Runtime
          test -s newIDE/app/build/nova-app-192.png
          test -s newIDE/app/build/nova-app-512.png
          grep -q 'NOVA Studio' newIDE/app/build/index.html
          cp newIDE/app/build/index.html newIDE/app/build/404.html
          touch newIDE/app/build/.nojekyll
          du -sh newIDE/app/build
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: newIDE/app/build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy NOVA Studio
        id: pages
        uses: actions/deploy-pages@v4
