# NOVA Studio v0.2: FULL GDevelop editor + mobile Construct-inspired UI.
# Single-file installer for GitHub.com on Android (no local computer).
# Source of embedded UI is distributed separately in the ZIP for inspection.
name: NOVA Studio — Android editor build and Pages

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/nova-studio.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nova-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout full GDevelop fork
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
