              raise SystemExit('This repository is not a full GDevelop fork.')
          for name, encoded, expected_sha in PAYLOAD:
              raw = zlib.decompress(base64.b64decode(encoded))
              actual_sha = hashlib.sha256(raw).hexdigest()
              if actual_sha != expected_sha:
                  raise SystemExit('Embedded NOVA payload checksum failed: ' + name)
              (public / name).write_bytes(raw)
          html = index.read_text(encoding='utf-8')
          marker = '<!-- NOVA_STUDIO_MOBILE_PATCH -->'
          if marker not in html:
              if '</head>' not in html:
                  raise SystemExit('Cannot patch GDevelop: missing </head>')
              injection = ('  ' + marker + '\n'
                           '  <link rel="stylesheet" href="%PUBLIC_URL%/nova-mobile.css" />\n'
                           '  <script defer src="%PUBLIC_URL%/nova-mobile.js"></script>\n')
              html = html.replace('</head>', injection + '</head>', 1)
          html = html.replace('<title>GDevelop 5</title>', '<title>NOVA Studio — GDevelop fork</title>')
          index.write_text(html, encoding='utf-8')
          print('NOVA: successfully patched real GDevelop editor')
